<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Listings – Sandbox</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f4f4f4; }
        .job-listing {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .title { font-size: 1.4rem; margin: 0 0 6px; color: #1a1a1a; }
        .company { font-size: 1rem; color: #555; margin: 0 0 10px; }
        .apply-link {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
        }
        .apply-link:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <h1>📋 Sandbox Job Board</h1>
    <p>This page is for testing your web scraper.</p>

    <!-- JOB LISTINGS (matches your config.json selectors) -->
    <div class="job-listing">
        <h2 class="title">Senior Frontend Developer</h2>
        <p class="company">TechCorp Inc.</p>
        <a class="apply-link" href="/apply/1">Apply now</a>
    </div>

    <div class="job-listing">
        <h2 class="title">Backend Engineer (Python)</h2>
        <p class="company">CloudSolutions</p>
        <a class="apply-link" href="/apply/2">Apply now</a>
    </div>

    <div class="job-listing">
        <h2 class="title">Data Analyst</h2>
        <p class="company">Insight Analytics</p>
        <a class="apply-link" href="/apply/3">Apply now</a>
    </div>

    <div class="job-listing">
        <h2 class="title">DevOps Engineer</h2>
        <p class="company">InfraWorks</p>
        <a class="apply-link" href="/apply/4">Apply now</a>
    </div>
</body>
</html>
